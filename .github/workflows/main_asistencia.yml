name: Build and Deploy to Azure Web App (asistencia)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          zip -r release.zip . \
            -x "venv/*" \
            -x ".git/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "static/qr_codes/*" \
            -x "static/reports/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: asistencia-residencia-6282
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_17ae63d944d5487c871ac1d4f9fc20f3 }}
          package: release.zip
