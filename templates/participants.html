{% extends "base.html" %}
{% block title %}Participantes{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>Registro de Participantes</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Registro Manual</h5>
                <form id="registerForm" method="POST" action="{{ url_for('register_participant') }}">
                    <div class="mb-3">
                        <label>Proyecto</label>
                        <select name="project_id" id="projectSelect" class="form-control" required>
                            <option value="">Seleccione un proyecto...</option>
                            {% for project in projects %}
                            <option value="{{ project.id if project is mapping else project[0] }}">{{ project.name if project is mapping else project[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Nombre Completo (Obligatorio Base)</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Teléfono</label>
                        <input type="text" name="phone" class="form-control">
                    </div>
                    <div id="dynamicFields">
                        <!-- Custom fields injected here -->
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Importar Excel</h5>
                <form id="excelForm" method="POST" action="{{ url_for('upload_excel') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label>Proyecto</label>
                        <select name="project_id" class="form-control" required>
                            <option value="">Seleccione un proyecto...</option>
                            {% for project in projects %}
                            <option value="{{ project.id if project is mapping else project[0] }}">{{ project.name if project is mapping else project[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
                    </div>
                    <button type="submit" class="btn btn-success">Importar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('projectSelect').addEventListener('change', function() {
    const projectId = this.value;
    const container = document.getElementById('dynamicFields');
    container.innerHTML = '';

    if(!projectId) return;

    fetch(`/projects/${projectId}/fields/api`)
        .then(res => res.json())
        .then(fields => {
            fields.forEach(f => {
                const isRequired = f.is_required ? 'required' : '';
                const type = f.type || 'text';
                const fieldName = f.name;
                const fieldId = f.id;
                const html = `
                    <div class="mb-3">
                        <label>${fieldName} ${f.is_required ? '*' : ''}</label>
                        <input type="${type}" name="field_${fieldId}" class="form-control" ${isRequired}>
                    </div>
                `;
                container.innerHTML += html;
            });
        });
});

document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    fetch(this.action, {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            alert('Registrado con token: ' + data.token);
            this.reset();
            document.getElementById('dynamicFields').innerHTML = '';
        } else {
            alert('Error: ' + data.error);
        }
    });
});
</script>
{% endblock %}
