{% extends 'base.html' %}
{% block title %}Iniciar Sesion{% endblock %}
{% block content %}
<div class="grid min-h-[calc(100vh-7rem)] place-items-center">
    <div class="w-full max-w-md">
        <div class="mb-6 text-center">
            <img class="mx-auto mb-4 h-14 w-14 rounded-2xl object-contain shadow-soft" src="{{ url_for('static', filename='img/asistec.webp') }}" alt="AsisTec">
            <h1 class="!mb-2 !text-center text-3xl font-bold text-slate-950">AsisTec</h1>
            <p class="text-sm font-medium text-slate-500">Gestiona eventos, credenciales y asistencia desde un solo lugar.</p>
        </div>
        <div class="card p-4 shadow">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contrasena</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn tecn-blue text-white w-100">Iniciar sesion</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
