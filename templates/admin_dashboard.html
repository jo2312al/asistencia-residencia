{% extends "base.html" %}
{% block title %}Dashboard Superadmin / Admin{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-4">Panel de Administración</h2>
    </div>
</div>
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Participantes Totales</h5>
                <p class="card-text display-4">{{ total_students | default(0) }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Asistencias Totales</h5>
                <p class="card-text display-4">{{ total_attendance | default(0) }}</p>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <h4>Crear Nuevo Proyecto</h4>
        <form method="POST" action="{{ url_for('manage_projects') }}">
            <div class="mb-3">
                <label>Nombre del Proyecto</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Descripción</label>
                <textarea name="description" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <label>Lugar</label>
                <input type="text" name="location" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Crear Proyecto</button>
        </form>
    </div>
</div>
{% endblock %}
